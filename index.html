<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Timestamped To-Do App</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="container">
    <!-- AUTH SECTION -->
    <div id="auth-section">
        <h2>TaskManager</h2>
        <p class="subhead">Every task, stamped the moment it happens.</p>

        <div class="tab-buttons">
            <button class="tab-btn active" id="login-tab" onclick="switchTab('login')">Login</button>
            <button class="tab-btn" id="register-tab" onclick="switchTab('register')">Register</button>
        </div>

        <form id="auth-form" onsubmit="handleAuth(event)">
            <div class="form-group">
                <label for="username" id="username-label">Username</label>
                <input type="text" id="username" required>
            </div>
            <div class="form-group">
                <label for="password" id="password-label">Password</label>
                <input type="password" id="password" required>
            </div>
            <button type="submit" class="btn" id="auth-submit-btn">Login</button>
            <div class="error-msg" id="auth-error"></div>
        </form>
    </div>

    <!-- TODO DASHBOARD SECTION -->
    <div id="todo-section" class="hidden">
        <div class="dashboard-header">
            <div>
                <h3>My Tasks</h3>
                <p class="subhead subhead--tight">Stamped on entry, timestamped on close.</p>
            </div>
            <button class="logout-btn" onclick="logout()">Logout</button>
        </div>

        <form class="todo-input-group" onsubmit="createTodo(event)">
            <input type="text" id="new-todo-title" placeholder="Add a new task…" required>
            <button type="submit" class="btn btn--add">Add</button>
        </form>

        <div class="filter-bar">
            <label for="date-filter" class="filter-label">Filter by date</label>
            <input type="date" id="date-filter" onchange="applyDateFilter()">
            <button type="button" class="clear-filter-btn" id="clear-filter-btn" onclick="clearDateFilter()">Clear</button>
        </div>

        <p class="empty-msg hidden" id="empty-msg">No tasks logged for this date.</p>

        <ul class="todo-list" id="todo-list">
            <!-- Tasks dynamically injected here -->
        </ul>
    </div>
</div>

<script src="script.js"></script>
</body>
</html>
